# Versioned API agreement derived from the existing frontend; no implementation in this stage.
openapi: 3.0.3
info:
  title: WeCode API contract
  version: 1.0.0
  description: 'Contract stage only: no backend, SQLite or real API client implemented. Derived from current
    LearningService and its consumers. All account-owned data is selected exclusively from a validated
    bearer credential; there is no client-supplied private user ID. Closed request schemas reject identity/correctness/progress
    fields. Authored checking happens on the future server; no arbitrary code execution. English UI/content
    and current completion/assistance rules are preserved. Real auth intentionally differs from public-passphrase
    browser-local mock auth; see docs/api-mapping.md. HTTP validation/auth failures have no progress/attempt
    side effects; writes must commit before success. Error responses never disclose tokens/passwords/keys/private
    data. Production uses HTTPS; local server configuration is future work.'
servers:
- url: /api/v1
  description: Relative API base; no server is started by this contract stage.
security:
- bearerAuth: []
tags:
- name: Authentication
- name: Current learner
- name: Learning workspace
- name: Practice
paths:
  /auth/register:
    post:
      operationId: register
      summary: Register and start a real session
      description: 'Requires a private password in addition to mock name/email. Normalize name/email and
        enforce case-insensitive email uniqueness; never accept the fixed public demo passphrase as a
        special credential. New learner: Python active, every level Beginner, onboarded=false. Persist
        an adaptive password hash only, issue a revocable opaque token; passwords never appear in output.
        No email verification/reset added.'
      tags:
      - Authentication
      x-frontend-service: register
      responses:
        '201':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Duplicate'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with a real password
      description: Normalize email only; verify the private password hash and issue a new opaque session.
        Same generic credentials error for unknown email and wrong password; no account enumeration in
        this response. Other existing sessions remain until expiry/logout. No public demo password in
        production auth.
      tags:
      - Authentication
      x-frontend-service: login
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Credentials'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /auth/session:
    delete:
      operationId: logout
      summary: Revoke the current session
      description: Resolve current account/session from bearer token and revoke that token before 204.
        Do not delete learner data, revoke unrelated sessions, or accept a user ID. A later repeat after
        revocation returns 401; future client treats 401 during logout as locally signed out.
      tags:
      - Authentication
      x-frontend-service: logout
      responses:
        '204':
          description: Success; no response body.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      operationId: session
      summary: Read the authenticated current learner
      description: Valid token returns Learner. Missing/invalid/expired/revoked credential returns 401,
        never another learner. Future session() adapter maps 401 to null and clears its session credential;
        all other operations surface 401 as sign-in required. No anonymous learner/null JSON response.
      tags:
      - Current learner
      x-frontend-service: session
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Learner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: profile
      summary: Update only the current display name
      description: Trim name, validate normalized length 2–60 and keep email/identity/preferences/history
        unchanged. Future frontend refreshes snapshot after 204. No client userId; unknown fields including
        id/email/progress are rejected. Repeating the same name is idempotent.
      tags:
      - Current learner
      x-frontend-service: profile
      responses:
        '204':
          description: Success; no response body.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
  /me/preferences:
    patch:
      operationId: preferences
      summary: Set active track and that track level
      description: Update activeTrack and only levels[track]. Preserve every other track level and all
        prior lesson/exercise/attempt history. onboarded=true is monotonic; false/omitted does not reset
        it. No locks are created by level choice. Repeating identical input is idempotent.
      tags:
      - Current learner
      x-frontend-service: preferences
      responses:
        '204':
          description: Success; no response body.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesInput'
  /me/snapshot:
    get:
      operationId: snapshot
      summary: Read curriculum and private learning state
      description: 'Current frontend aggregate read: current learner, all nine units/lessons/27 public
        exercise prompts, current-user progress and entire attempt history. No filtering query is needed
        by current consumers. Return a coherent snapshot after committed writes. Do not include answer
        keys, accepted/rejected variants, hints, solutions or hidden solution explanations in units. Own
        submitted answers/feedback in attempts are intentional user history, not a key export. UI computes
        overall completed/9, per-track completed/3, independent exercises/27 and current unit steps/4.
        Unit is complete iff read and all three correct flags; retries cannot add duplicate completion
        credit. No XP/scoring.'
      tags:
      - Learning workspace
      x-frontend-service: snapshot
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me/units/{unitId}/lesson-read:
    put:
      operationId: markRead
      summary: Mark a lesson read
      description: Idempotently set read=true for authenticated learner and this unit. Repeats never create
        another completion credit. Lesson read alone is not unit completion. Unit must exist; no level
        prerequisite or unread/reset operation.
      tags:
      - Learning workspace
      x-frontend-service: markRead
      responses:
        '204':
          description: Success; no response body.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonReadInput'
      parameters:
      - $ref: '#/components/parameters/UnitId'
  /me/units/{unitId}/exercises/{exerciseId}/submissions:
    post:
      operationId: submit
      summary: Check and save one authored-rule attempt
      description: The future server normalizes CRLF to LF then trims surrounding whitespace, checks authored
        accepted variants and atomically saves an attempt plus progress flags. Never execute learner code
        or trust client correctness/assistance/user identity. Quiz accepts a stable option ID; an unknown
        nonblank option ID is a normal incorrect attempt. Wrong answer is HTTP 201 with correct=false
        and explanatory feedback, and can be retried without limit. Invalid/blank/oversize input is 422
        and records no attempt. No generic case/internal-space/semantic-equivalence normalization. Each
        POST is a new saved attempt, including transport retries; all flags and completion are Boolean
        historical facts so repeat requests never duplicate completion credit. correct=true sets correct-ever;
        independent-ever becomes true only if no prior solution reveal. Later wrong answers cannot clear
        either. assisted is revealed at checking time. A later reveal never erases an earlier independent
        solve. Concurrent submit/reveal/read writes are serialized atomically per learner so observed
        assistance and snapshot are consistent.
      tags:
      - Practice
      x-frontend-service: submit
      responses:
        '201':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionInput'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/ExerciseId'
  /me/units/{unitId}/exercises/{exerciseId}/hints:
    post:
      operationId: hint
      summary: Request the authored hint after a wrong attempt
      description: Requires any earlier incorrect attempt by this same authenticated learner on this exact
        exercise, even if later correct. Otherwise 409 hint-locked, with no progress mutation. On success
        atomically increment hintCount and return a JSON string. Repeats count as new hint requests but
        do not affect credit or solution-assisted flags. No request body, no userId.
      tags:
      - Practice
      x-frontend-service: hint
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HintLocked'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/ExerciseId'
  /me/units/{unitId}/exercises/{exerciseId}/solution-reveal:
    put:
      operationId: solution
      summary: Explicitly reveal and record the authored solution
      description: Idempotently persist revealed=true before returning canonical answer and explanation.
        Available separately from submit/hint, without requiring a wrong attempt. Reveal alone is not
        correct/completed; a later correct submission can complete assisted work but cannot create a new
        independent solve. Preserve any independent solve that happened before this reveal. Only this
        explicit operation returns solution metadata; later ordinary curriculum remains unrevealed. No
        request body; repeated reveal does not add completion credit.
      tags:
      - Practice
      x-frontend-service: solution
      responses:
        '200':
          description: Success.
          headers:
            Cache-Control:
              description: Private credentials/data and errors must not be cached.
              schema:
                type: string
                enum:
                - no-store
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/UnitId'
      - $ref: '#/components/parameters/ExerciseId'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
      description: 'Authorization: Bearer <opaque-token>. At least 256 bits of cryptographic randomness;
        24-hour expiry, immediate revocation by logout. Server resolves current account from session registry/token
        verification; never from request userId or learner.id. Use HTTPS outside local development; do
        not log credentials. Missing, malformed, expired, unknown or revoked tokens yield 401. No roles/admin/refresh
        introduced.'
  parameters:
    UnitId:
      name: unitId
      in: path
      required: true
      description: Stable authored unit ID.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: python-beginner
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      description: Stable authored exercise ID, required to belong to unitId; mismatches are 404.
      schema:
        $ref: '#/components/schemas/Identifier'
      example: python-beginner-bug
  schemas:
    Track:
      type: string
      enum:
      - Python
      - SQL
      - Git
      example: Python
    Level:
      type: string
      enum:
      - Beginner
      - Intermediate
      - Advanced
      example: Beginner
    Identifier:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[a-z][a-z0-9-]*$
      example: python-beginner
    NameInput:
      type: string
      minLength: 2
      maxLength: 60
      pattern: \S
      description: Trim surrounding whitespace before validation. Normalized display name is 2–60 characters.
        Future adapter trims before sending.
      example: Demo Learner
    EmailInput:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
      description: Future adapter trims and lowercases before sending. Server also trims/lowercases for
        uniqueness and credential lookup.
      example: learner@example.test
    PasswordInput:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: Real private password, never the mock public passphrase. Do not trim, log, return or
        persist in plaintext; future server uses an adaptive password hash. This input is a contract-stage
        protocol default, not implemented frontend behavior.
      example: example-only-secret-password
    RegisterInput:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - password
      properties:
        name:
          $ref: '#/components/schemas/NameInput'
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/PasswordInput'
      example:
        name: Demo Learner
        email: learner@example.test
        password: example-only-secret-password
    LoginInput:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          $ref: '#/components/schemas/EmailInput'
        password:
          $ref: '#/components/schemas/PasswordInput'
      example:
        email: learner@example.test
        password: example-only-secret-password
    TrackLevels:
      type: object
      additionalProperties: false
      required:
      - Python
      - SQL
      - Git
      properties:
        Python:
          $ref: '#/components/schemas/Level'
        SQL:
          $ref: '#/components/schemas/Level'
        Git:
          $ref: '#/components/schemas/Level'
      example:
        Python: Beginner
        SQL: Beginner
        Git: Beginner
    Learner:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - email
      - activeTrack
      - levels
      - onboarded
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          $ref: '#/components/schemas/NameInput'
        email:
          $ref: '#/components/schemas/EmailInput'
        activeTrack:
          $ref: '#/components/schemas/Track'
        levels:
          $ref: '#/components/schemas/TrackLevels'
        onboarded:
          type: boolean
      description: Response-only identity from the authenticated account. New accounts start at Beginner
        in every track, active Python, onboarded false. Never accept this object as an update request.
      example:
        id: cd5dfdb5-c7b8-4a2d-9b50-c9e61dd603a7
        name: Demo Learner
        email: learner@example.test
        activeTrack: Python
        levels:
          Python: Beginner
          SQL: Beginner
          Git: Beginner
        onboarded: true
    AuthSession:
      type: object
      additionalProperties: false
      required:
      - learner
      - accessToken
      - tokenType
      - expiresAt
      properties:
        learner:
          $ref: '#/components/schemas/Learner'
        accessToken:
          type: string
          minLength: 32
          description: Opaque, cryptographically random bearer credential; example is deliberately nonfunctional.
        tokenType:
          type: string
          enum:
          - Bearer
        expiresAt:
          type: string
          format: date-time
      description: Registration and login establish a new session. Token expires 24 hours after issuance
        and is immediately revocable by logout. No refresh endpoint in MVP. No password in response.
      example:
        learner:
          id: cd5dfdb5-c7b8-4a2d-9b50-c9e61dd603a7
          name: Demo Learner
          email: learner@example.test
          activeTrack: Python
          levels:
            Python: Beginner
            SQL: Beginner
            Git: Beginner
          onboarded: false
        accessToken: example-nonfunctional-opaque-token-not-a-credential
        tokenType: Bearer
        expiresAt: '2026-10-20T11:00:00Z'
    PreferencesInput:
      type: object
      additionalProperties: false
      required:
      - track
      - level
      properties:
        track:
          $ref: '#/components/schemas/Track'
        level:
          $ref: '#/components/schemas/Level'
        onboarded:
          type: boolean
          default: false
          description: True permanently marks onboarding complete; false/omitted leaves the current flag
            unchanged, matching mockService.
      description: Sets activeTrack and only that track level. Other track levels, all unit history and
        attempts are preserved.
      example:
        track: SQL
        level: Intermediate
        onboarded: true
    ProfileInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/NameInput'
      description: Email, identity, levels and progress cannot be edited here.
      example:
        name: New Display Name
    LessonReadInput:
      type: object
      additionalProperties: false
      required:
      - read
      properties:
        read:
          type: boolean
          enum:
          - true
      description: Only the read=true transition exists; repeated PUT is idempotent. Cannot un-read or
        erase history.
      example:
        read: true
    SubmissionInput:
      type: object
      additionalProperties: false
      required:
      - answer
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: \S
          description: A quiz option ID or authored text fragment. Future adapter normalizes CRLF to LF
            and trims surrounding whitespace before sending; server repeats this normalization and rejects
            blank or normalized length outside 1–4000. Wire payload is capped at 4000 characters. No other
            whitespace/case/punctuation normalization or code execution.
          example: int(age) + 1
      example:
        answer: int(age) + 1
    QuizOption:
      type: object
      additionalProperties: false
      required:
      - id
      - text
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
        text:
          type: string
          minLength: 1
      example:
        id: a
        text: '5'
    QuizExercise:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - prompt
      - options
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          enum:
          - Quiz
        prompt:
          type: string
          minLength: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuizOption'
          minItems: 2
      description: Public exercise fields only. Exactly one authored option is correct, but no field identifies
        it. Stable unique option IDs are used for submissions.
      example:
        id: python-beginner-quiz
        type: Quiz
        prompt: What is printed by print(2 + 3)?
        options:
        - id: a
          text: '5'
        - id: b
          text: '23'
        - id: c
          text: 2 + 3
    TextExercise:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - prompt
      - code
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          enum:
          - Fix the Bug
          - Complete the Code
        prompt:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
      description: Public prompt and starting fragment only. Keys, accepted/rejected variants, hints and
        solution explanations are not curriculum fields.
      example:
        id: python-beginner-bug
        type: Fix the Bug
        prompt: Replace only the faulty right-hand expression so the result is the number 8.
        code: 'age = "7"

          next_age = age + 1'
    Exercise:
      oneOf:
      - $ref: '#/components/schemas/QuizExercise'
      - $ref: '#/components/schemas/TextExercise'
      description: A discriminated exercise union with closed object variants; no answer-key or unrevealed
        solution metadata.
    Unit:
      type: object
      additionalProperties: false
      required:
      - id
      - track
      - level
      - title
      - summary
      - lesson
      - example
      - takeaway
      - exercises
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        track:
          $ref: '#/components/schemas/Track'
        level:
          $ref: '#/components/schemas/Level'
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        lesson:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        example:
          type: string
          minLength: 1
          description: Instructional lesson example, not an answer key.
        takeaway:
          type: string
          minLength: 1
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
          minItems: 3
          maxItems: 3
