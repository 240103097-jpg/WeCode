          lesson:
          - A variable name refers to a value. In Python, = assigns a value and == compares two values.
            Strings use quotes; integers such as 3 do not. print() displays a value.
          - input() returns a string, even when the learner types digits. Use int() to convert a string
            containing an integer before doing arithmetic. An invalid integer string raises ValueError;
            our exercises use valid numeric strings.
